name: Stock Radar VN Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * 1-5'
    - cron: '0 2,3,4,6,7,8 * * 1-5'
    - cron: '35 4 * * 1-5'
    - cron: '30 8 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: stock-radar-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test core engine
        run: node --test tests/*.test.js
      - name: Validate browser modules
        run: node --check app.js && node --check decision-core.js && node --check decision-ui.js && node --check etf-ui.js && node --check governance-ui.js && node --check event-proxy-ui.js && node --check freshness.js && node --check universe.js
      - name: Refresh market snapshots
        run: node scripts/update-data.mjs
      - name: Enrich fresh fundamentals
        run: node scripts/enrich-fundamentals.mjs
      - name: Enrich event evidence fallback
        run: node scripts/enrich-events.mjs
      - name: Refresh ETF snapshots
        run: node scripts/update-etf.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
